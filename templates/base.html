{% load static %}
<!doctype html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}GameVault{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/estilos.css' %}" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <body class="bg-body-tertiary">
        <header>
            <nav class="navbar navbar-expand-lg bg-dark border-bottom border-secondary" data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand fw-bold" href="{% url 'shop:inicio' %}">
                        <img src="{% static 'img/logo.svg' %}" alt="GameVault" width="32" height="32" />
                        GameVault
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Abrir navegación">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="mainNavigation">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="{% url 'shop:inicio' %}">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="{% url 'shop:inicio' %}#catalogo">Catálogo</a></li>
                            <li class="nav-item"><a class="nav-link" href="{% url 'shop:detalle' 1 %}">Destacado</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main>{% block content %}{% endblock %}</main>

        <footer class="border-top border-secondary mt-5 py-4">
            <div class="container text-center text-body-secondary">
                <small>&copy; 2026 GameVault. Tu próxima aventura empieza aquí.</small>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
