<!doctype html>
<html lang="es">
    <head><meta charset="utf-8"><title>GameVault</title></head>
    <body>
        <h1>Catálogo de videojuegos</h1>
        {% for producto in productos %}
        <p><a href="{% url 'shop:detalle' producto.id %}">{{ producto.nombre }}</a></p>
        {% empty %}
        <p>No hay productos disponibles.</p>
        {% endfor %}
    </body>
</html>
